<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>
    body { 
        width: 350px; 
        padding: 15px; 
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
    }
    input { 
        width: 100%; 
        padding: 8px;
        margin-bottom: 10px; 
        box-sizing: border-box;
        border: 1px solid #ccc;
        border-radius: 4px;
    }
    button {
        width: 48%;
        padding: 10px;
        cursor: pointer;
        background-color: #007bff;
        color: white;
        border: none;
        border-radius: 4px;
        font-weight: bold;
    }
    button:hover { background-color: #0056b3; }
    #analyzeBtn { background-color: #28a745; }
    #analyzeBtn:hover { background-color: #218838; }
    
    #result { 
        margin-top: 15px; 
        font-size: 0.9em; 
        border-top: 1px solid #eee;
        padding-top: 10px;
    }
    table { width: 100%; border-collapse: collapse; margin-top: 10px; }
    th, td { text-align: left; padding: 6px; border-bottom: 1px solid #eee; }
  </style>
</head>
<body>
  <h3>Analizzatore Prezzi 🃏</h3>
  
  <!-- Campo per il Token (si auto-compila dal JS) -->
  <label style="font-size: 0.8em; color: #666;">API Token:</label>
  <input type="text" id="token" placeholder="Inserisci API Token">
  
  <!-- Campo per la Carta -->
  <label style="font-size: 0.8em; color: #666;">Nome Carta:</label>
  <input type="text" id="cardName" placeholder="Es. Graceful Demeanor">

  <!-- Contenitore pulsanti affiancati -->
  <div style="display: flex; justify-content: space-between;">
    <button id="searchBtn">Cerca Min</button>
    <button id="analyzeBtn">Analizza 10</button>
    <!-- Sotto gli altri pulsanti nel popup.html -->
  </div>
  <button id="listSetBtn" style="width: 100%; margin-top: 10px; background-color: #6f42c1; color: white; border: none; padding: 10px; border-radius: 4px; font-weight: bold; cursor: pointer;">
    Listato Completo GD04
</button>

  <!-- Area Risultati -->
  <div id="result"></div>

  <script src="popup.js"></script>
</body>
</html>
